<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>RaspiCam Login</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth">
  <form class="auth-card" id="form" data-mode="login">
    <h1>RaspiCam</h1>
    <p>Enter your dashboard password to continue.</p>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="error-text" id="error"></div>
  </form>
</div>
<script type="module" src="/static/js/auth.js"></script>
</body>
</html>
