<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>RaspiCam</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span id="health-dot"></span>RaspiCam</div>
    <div class="topbar-meta">
      <a class="chip link" id="tunnel-chip" href="#" hidden>Tunnel</a>
      <div class="chip" id="chip-storage">Storage</div>
      <div class="chip" id="chip-cpu">CPU</div>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-view="live" class="active">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 11l6-4v10l-6-4z"/></svg>
      Live
    </button>
    <button data-view="recordings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Playback
    </button>
    <button data-view="storage">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      Storage
    </button>
    <button data-view="cameras">
      <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Cameras
    </button>
    <button data-view="tunnel">
      <svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      Tunnel
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      Settings
    </button>
  </nav>

  <main class="main">
    <section class="view active" id="view-live">
      <div class="view-head">
        <h1>Live view</h1>
        <div class="spacer"></div>
        <button class="btn small" id="live-mode">Low bandwidth</button>
        <button class="btn small" id="live-refresh">Refresh</button>
      </div>
      <div class="grid dense" id="live-grid"></div>
      <div class="empty" id="live-empty" hidden>No cameras yet. Open the Cameras tab to detect and add one.</div>
    </section>

    <section class="view" id="view-recordings">
      <div class="view-head">
        <h1>Playback</h1>
      </div>
      <div class="panel">
        <div class="row">
          <div class="field">
            <label for="rec-camera">Camera</label>
            <select id="rec-camera"></select>
          </div>
          <div class="field">
            <label for="rec-date">Date</label>
            <input id="rec-date" type="date">
          </div>
        </div>
        <div class="actions">
          <button class="btn small" id="rec-prev">Previous day</button>
          <button class="btn small" id="rec-next">Next day</button>
          <button class="btn small" id="rec-today">Today</button>
          <button class="btn small" id="rec-reload">Reload</button>
        </div>
      </div>
      <div class="panel">
        <video class="player" id="rec-player" controls playsinline preload="metadata"></video>
        <div class="timeline" id="rec-timeline"></div>
        <div class="meta" id="rec-position" style="margin-top:8px;color:var(--muted);font-size:12px"></div>
      </div>
      <div class="panel">
        <h2>Segments</h2>
        <div class="list" id="rec-list"></div>
      </div>
      <div class="panel">
        <h2>Photos</h2>
        <div class="gallery" id="rec-gallery"></div>
      </div>
    </section>

    <section class="view" id="view-storage">
      <div class="view-head">
        <h1>Storage</h1>
        <div class="spacer"></div>
        <button class="btn small" id="storage-scan">Rescan</button>
      </div>
      <div class="panel" id="storage-summary"></div>
      <div class="panel">
        <h2>Available locations</h2>
        <div class="list" id="storage-mounts"></div>
      </div>
      <div class="panel">
        <h2>Recording rules</h2>
        <div class="row">
          <div class="field">
            <label for="storage-segment">Segment length (minutes)</label>
            <input id="storage-segment" type="number" min="1" max="60" step="1">
          </div>
          <div class="field">
            <label for="storage-retention">Delete oldest above (% used)</label>
            <input id="storage-retention" type="number" min="10" max="99" step="1">
          </div>
        </div>
        <div class="field">
          <label for="storage-free">Always keep free (GB)</label>
          <input id="storage-free" type="number" min="0.2" max="512" step="0.1">
        </div>
        <button class="btn primary" id="storage-save">Save rules</button>
      </div>
    </section>

    <section class="view" id="view-cameras">
      <div class="view-head">
        <h1>Cameras</h1>
        <div class="spacer"></div>
        <button class="btn small" id="cam-detect">Detect</button>
        <button class="btn small" id="cam-add-network">Add network camera</button>
      </div>
      <div class="panel">
        <h2>Detected and available</h2>
        <div class="list" id="cam-sources"></div>
      </div>
      <div class="panel">
        <h2>Configured</h2>
        <div class="list" id="cam-list"></div>
      </div>
    </section>

    <section class="view" id="view-tunnel">
      <div class="view-head">
        <h1>Remote access</h1>
      </div>
      <div class="panel" id="tunnel-status"></div>
      <div class="panel">
        <h2>Providers</h2>
        <div class="list" id="tunnel-providers"></div>
        <label class="switch" style="margin-top:12px">
          <input type="checkbox" id="tunnel-autostart">
          Start the selected tunnel automatically on boot
        </label>
      </div>
      <div class="panel">
        <h2>Log</h2>
        <div class="log" id="tunnel-log"></div>
      </div>
    </section>

    <section class="view" id="view-settings">
      <div class="view-head">
        <h1>Settings</h1>
      </div>
      <div class="panel">
        <h2>System</h2>
        <div class="stat-grid" id="settings-stats"></div>
      </div>
      <div class="panel">
        <h2>Change password</h2>
        <div class="field">
          <label for="pw-current">Current password</label>
          <input id="pw-current" type="password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="pw-new">New password</label>
          <input id="pw-new" type="password" autocomplete="new-password">
        </div>
        <button class="btn primary" id="pw-save">Update password</button>
      </div>
      <div class="panel">
        <h2>Service</h2>
        <div class="actions">
          <button class="btn" id="settings-restart">Restart RaspiCam</button>
          <button class="btn danger" id="settings-logout">Sign out</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-head">
    <strong id="overlay-title"></strong>
    <div style="margin-left:auto"><button class="btn small" id="overlay-close">Close</button></div>
  </div>
  <div class="overlay-body"><img id="overlay-image" alt=""></div>
  <div class="overlay-foot" id="overlay-actions"></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="btn small" id="sheet-close">Close</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
