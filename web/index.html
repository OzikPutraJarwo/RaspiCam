<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>RaspiCam</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Raspi<em>Cam</em></div>
    <div class="topbar-meta">
      <a id="tunnel-chip" href="#" target="_blank" rel="noopener" hidden></a>
      <span id="chip-storage"></span>
      <span id="chip-cpu"></span>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-view="live" class="active">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="1.5"/><path d="M16 11l6-4v10l-6-4z"/></svg>
      Live
    </button>
    <button data-view="recordings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Playback
    </button>
    <button data-view="storage">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      Storage
    </button>
    <button data-view="cameras">
      <svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Cameras
    </button>
    <button data-view="tunnel">
      <svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      Tunnel
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      Settings
    </button>
  </nav>

  <main class="main">
    <section class="view active" id="view-live">
      <div class="view-head">
        <h1>Live</h1>
        <div class="spacer"></div>
        <button class="btn small" id="live-mode">Low bandwidth</button>
        <button class="btn small" id="live-refresh">Reload</button>
      </div>
      <div class="grid" id="live-grid"></div>
      <div class="empty" id="live-empty" hidden>No cameras yet. Open Cameras to detect one.</div>
    </section>

    <section class="view" id="view-recordings">
      <div class="view-head">
        <h1>Playback</h1>
      </div>
      <div class="panel flat">
        <div class="row">
          <div class="field">
            <label for="rec-camera">Camera</label>
            <select id="rec-camera"></select>
          </div>
          <div class="field">
            <label for="rec-date">Date</label>
            <input id="rec-date" type="date">
          </div>
        </div>
        <div class="actions">
          <button class="btn small" id="rec-prev">Earlier</button>
          <button class="btn small" id="rec-next">Later</button>
          <button class="btn small" id="rec-today">Today</button>
          <button class="btn small" id="rec-reload">Reload</button>
        </div>
      </div>
      <div class="panel flat">
        <video class="player" id="rec-player" controls playsinline preload="metadata"></video>
        <div class="timeline" id="rec-timeline"></div>
        <div class="position" id="rec-position"></div>
      </div>
      <div class="panel flat">
        <div class="section-label">Segments</div>
        <div class="list" id="rec-list"></div>
      </div>
      <div class="panel flat">
        <div class="section-label">Photos</div>
        <div class="gallery" id="rec-gallery"></div>
      </div>
    </section>

    <section class="view" id="view-storage">
      <div class="view-head">
        <h1>Storage</h1>
        <div class="spacer"></div>
        <button class="btn small" id="storage-scan">Rescan</button>
      </div>
      <div class="panel flat" id="storage-summary"></div>
      <div class="panel flat">
        <div class="section-label">Available locations</div>
        <div class="list" id="storage-mounts"></div>
        <div class="field" style="margin-top:16px">
          <label for="storage-path">Or type any folder</label>
          <div class="actions">
            <input id="storage-path" type="text" placeholder="/media/usb-drive" style="flex:1;min-width:180px">
            <button class="btn" id="storage-use-path">Use folder</button>
          </div>
        </div>
      </div>
      <div class="panel flat">
        <div class="section-label">Recording rules</div>
        <div class="row">
          <div class="field">
            <label for="storage-segment">Segment length (minutes)</label>
            <input id="storage-segment" type="number" min="1" max="60" step="1">
          </div>
          <div class="field">
            <label for="storage-retention">Delete oldest above (% used)</label>
            <input id="storage-retention" type="number" min="10" max="99" step="1">
          </div>
        </div>
        <div class="field">
          <label for="storage-free">Always keep free (GB)</label>
          <input id="storage-free" type="number" min="0.2" max="512" step="0.1">
        </div>
        <button class="btn primary" id="storage-save">Save rules</button>
      </div>
    </section>

    <section class="view" id="view-cameras">
      <div class="view-head">
        <h1>Cameras</h1>
        <div class="spacer"></div>
        <button class="btn small" id="cam-detect">Detect</button>
        <button class="btn small" id="cam-add-network">Add network camera</button>
      </div>
      <div class="panel flat">
        <div class="section-label">Detected</div>
        <div class="list" id="cam-sources"></div>
      </div>
      <div class="panel flat">
        <div class="section-label">In use</div>
        <div class="list" id="cam-list"></div>
      </div>
    </section>

    <section class="view" id="view-tunnel">
      <div class="view-head">
        <h1>Remote access</h1>
        <span class="lede">No account needed. Several can run at once.</span>
        <div class="spacer"></div>
        <button class="btn small danger" id="tunnel-stop-all">Stop all</button>
      </div>
      <div class="panel flat">
        <div class="list" id="tunnel-providers"></div>
      </div>
      <div class="panel flat">
        <div class="section-label">Activity</div>
        <div class="log" id="tunnel-log"></div>
      </div>
    </section>

    <section class="view" id="view-settings">
      <div class="view-head">
        <h1>Settings</h1>
      </div>
      <div class="panel flat">
        <div class="section-label">System</div>
        <div class="stat-grid" id="settings-stats"></div>
      </div>
      <div class="panel flat">
        <div class="section-label">Password</div>
        <div class="row">
          <div class="field">
            <label for="pw-current">Current</label>
            <input id="pw-current" type="password" autocomplete="current-password">
          </div>
          <div class="field">
            <label for="pw-new">New</label>
            <input id="pw-new" type="password" autocomplete="new-password">
          </div>
        </div>
        <button class="btn" id="pw-save">Update password</button>
      </div>
      <div class="panel flat">
        <div class="section-label">Service</div>
        <div class="actions">
          <button class="btn" id="settings-restart">Restart</button>
          <button class="btn" id="settings-logout">Sign out</button>
          <button class="btn danger" id="settings-uninstall">Uninstall RaspiCam</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-head">
    <strong id="overlay-title"></strong>
    <div style="margin-left:auto"><button class="btn small" id="overlay-close">Close</button></div>
  </div>
  <div class="overlay-body"><img id="overlay-image" alt=""></div>
  <div class="overlay-foot" id="overlay-actions"></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="btn small" id="sheet-close">Close</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
